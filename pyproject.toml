[project]
name = "debtmodel"
version = "0.1.0"
description = "Discrete-time model of the US public debt burden and inflation debasement, after Hilscher, Raviv & Reis (2014)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debtmodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
